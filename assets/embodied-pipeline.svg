<svg width="920" height="150" viewBox="0 0 920 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0C1322" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <style>
      .node-box { transition: stroke 0.3s ease; }
      .node-grp:hover .node-box { stroke: #38BDF8; }
    </style>
  </defs>

  <rect width="920" height="150" rx="12" fill="url(#pipeBg)" stroke="#1E293B" stroke-width="1.5" />
  <text x="460" y="22" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="10" letter-spacing="2">
    SAFE &amp; RELIABLE EMBODIED AI // AI × ROBOTICS
  </text>

  <line x1="215" y1="74" x2="255" y2="74" stroke="#38BDF8" stroke-width="1.8" />
  <line x1="435" y1="74" x2="475" y2="74" stroke="#818CF8" stroke-width="1.8" />
  <line x1="655" y1="74" x2="695" y2="74" stroke="#34D399" stroke-width="1.8" />

  <path d="M 785 106 L 785 130 L 125 130 L 125 106" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="4,4" />
  <text x="455" y="125" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="9.5" letter-spacing="1">
    ◀── SENSOR NOISE, LOCALIZATION DRIFT &amp; REAL-WORLD ADAPTATION ──▶
  </text>

  <circle r="3.5" fill="#38BDF8">
