    <text x="90" y="24" text-anchor="middle" fill="#34D399" font-family="monospace" font-weight="bold" font-size="12">03. CONTROL &amp; RL</text>
    <text x="90" y="42" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="10">PPO • MPC • Planning</text>
    <text x="90" y="55" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">Decision Under Uncertainty</text>
  </g>

  <g class="node-grp" transform="translate(695, 42)">
