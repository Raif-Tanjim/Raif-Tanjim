    <text x="90" y="24" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-weight="bold" font-size="12">01. PERCEPTION</text>
    <text x="90" y="42" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="10">Vision • LiDAR SLAM</text>
    <text x="90" y="55" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">IMU &amp; Sensor Fusion</text>
  </g>

  <g class="node-grp" transform="translate(255, 42)">
    <rect class="node-box" width="180" height="64" rx="8" fill="#0F172A" stroke="#818CF8" stroke-width="1.5" />
    <text x="90" y="24" text-anchor="middle" fill="#818CF8" font-family="monospace" font-weight="bold" font-size="12">02. PREDICTION</text>
    <text x="90" y="42" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="10">ML • Time-Series</text>
    <text x="90" y="55" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">State &amp; Fault Modeling</text>
  </g>

  <g class="node-grp" transform="translate(475, 42)">
