    <text x="95" y="24" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-weight="bold" font-size="12">04. SIM-TO-REAL</text>
    <text x="95" y="42" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="10">ROS2 • Webots • Gazebo</text>
    <text x="95" y="55" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">RPi • ESP32 • Physical HW</text>
