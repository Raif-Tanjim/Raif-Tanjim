    <linearGradient id="curveArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>
    
    <pattern id="isoGrid" width="60" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 17.32 L 30 34.64 L 0 17.32 Z" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
    <clipPath id="outerClip">
      <rect width="1000" height="360" rx="14" />
    </clipPath>
    <clipPath id="simClip">
      <rect x="0" y="0" width="724" height="360" />
    </clipPath>
  </defs>

  <style>
    .leg-l { animation: strideL 0.7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top center; }
    .leg-r { animation: strideR 0.7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top center; }
    @keyframes strideL { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
    @keyframes strideR { from { transform: rotate(18deg); } to { transform: rotate(-18deg); } }

    .lidar-spin { animation: lspin 3s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes lspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .curve-line { stroke-dasharray: 240; animation: drawCurve 12s ease-in-out infinite; }
    @keyframes drawCurve {
      0%   { stroke-dashoffset: 240; }
      75%  { stroke-dashoffset: 0; }
      95%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 240; }
    }
  </style>

