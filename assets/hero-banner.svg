  <defs>
    
    <linearGradient id="arenaFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2530" />
      <stop offset="55%" stop-color="#161C26" />
      <stop offset="100%" stop-color="#0F141D" />
    </linearGradient>
    <linearGradient id="isoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="isoLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
