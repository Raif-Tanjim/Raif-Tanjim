<svg width="420" height="280" viewBox="0 0 420 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lidarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.8" />
    </pattern>
  </defs>

  
  <rect width="420" height="280" rx="12" fill="#090D16" stroke="#1E293B" stroke-width="1.5" />
  <rect width="420" height="280" rx="12" fill="url(#grid)" />

  
  <circle cx="20" cy="20" r="4" fill="#10B981">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <text x="32" y="24" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="1">MULTI-AGENT NAVIGATION // UNCERTAINTY FIELD</text>

  
  <path d="M 55 220 C 120 210, 140 110, 220 130 C 290 148, 310 75, 365 65" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6" />
  
  
  <circle cx="365" cy="65" r="7" fill="none" stroke="#10B981" stroke-width="1.5">
    <animate attributeName="r" values="6;11;6" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="365" cy="65" r="3" fill="#10B981" />

  
  <g>
    <circle r="16" fill="#F59E0B" opacity="0.12" />
    <circle r="5" fill="#F59E0B" />
    <text x="8" y="4" fill="#FBBF24" font-family="monospace" font-size="9">H_01</text>
    <animateMotion dur="7s" repeatCount="indefinite" path="M 160 60 L 145 185 L 160 60" />
  </g>

  
  <g>
    <circle r="18" fill="#F59E0B" opacity="0.12" />
    <circle r="5" fill="#F59E0B" />
    <text x="8" y="4" fill="#FBBF24" font-family="monospace" font-size="9">H_02</text>
    <animateMotion dur="8.5s" repeatCount="indefinite" path="M 285 190 L 235 80 L 285 190" />
  </g>

  
  <g>
    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="none" stroke="#A855F7" stroke-width="1.5" />
    <circle r="2.5" fill="#A855F7" />
    <text x="9" y="4" fill="#C084FC" font-family="monospace" font-size="9">R_02</text>
    <animateMotion dur="9s" repeatCount="indefinite" path="M 330 215 Q 240 205 190 235 Q 240 205 330 215" />
  </g>

  
  <g>
    <circle r="48" fill="url(#lidarGlow)" />
    <circle r="32" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle r="7" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
    <circle r="2.5" fill="#38BDF8" />
    <animateMotion dur="7.5s" repeatCount="indefinite" path="M 55 220 C 120 210, 140 110, 220 130 C 290 148, 310 75, 365 65" />
  </g>

  
  <rect x="14" y="246" width="392" height="22" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <text x="24" y="260" fill="#38BDF8" font-family="monospace" font-size="10">STATE: COLLISION-FREE</text>
  <text x="195" y="260" fill="#94A3B8" font-family="monospace" font-size="10">|</text>
  <text x="210" y="260" fill="#10B981" font-family="monospace" font-size="10">POLICY: RL-SOCIAL-NAV</text>
</svg>
